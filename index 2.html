    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.20), rgba(0,0,0,.55));
      z-index: 0;
    }
    main {
      position: relative;
      z-index: 1;
      width: min(100%, 900px);
      padding: clamp(22px, 5vw, 48px);
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 24px;
      background: rgba(0,0,0,.28);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      text-shadow: 0 2px 16px rgba(0,0,0,.8);
    }
    h1 {
      margin: 0 0 28px;
      font-size: clamp(34px, 8vw, 72px);
      font-weight: 600;
      letter-spacing: .12em;
    }
    #countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 2vw, 20px);
      font-variant-numeric: tabular-nums;
    }
    .unit {
      min-width: 0;
      padding: clamp(10px, 2.5vw, 22px) 4px;
      border-radius: 16px;
      background: rgba(0,0,0,.38);
      border: 1px solid rgba(255,255,255,.22);
    }
    .number {
      display: block;
      font-size: clamp(30px, 8vw, 76px);
      line-height: 1.05;
      font-weight: 700;
    }
    .label {
      display: block;
      margin-top: 10px;
      font-size: clamp(12px, 2.5vw, 18px);
      letter-spacing: .12em;
    }
    .target {
      margin: 24px 0 0;
      font-size: clamp(13px, 2.8vw, 18px);
      letter-spacing: .06em;
      opacity: .92;
    }
    @media (max-width: 420px) {
      main { padding: 22px 12px; }
      h1 { margin-bottom: 20px; letter-spacing: .08em; }
      #countdown { gap: 6px; }
      .unit { border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>静等期待</h1>
    <section id="countdown" aria-label="倒计时">
      <div class="unit"><span class="number" id="days">000</span><span class="label">天</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="label">时</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="label">分</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="label">秒</span></div>
    </section>
    <p class="target">目标时间：2027年7月27日 20:00:00（北京时间）</p>
  </main>
  <script>
    // 北京时间 2027-07-27 20:00:00 = UTC 2027-07-27 12:00:00
    const target = Date.UTC(2027, 6, 27, 12, 0, 0);
    const fields = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };
    function updateCountdown() {
      let remaining = Math.max(0, target - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      fields.days.textContent = String(days).padStart(3, "0");
      fields.hours.textContent = String(hours).padStart(2, "0");
      fields.minutes.textContent = String(minutes).padStart(2, "0");
      fields.seconds.textContent = String(seconds).padStart(2, "0");
      if (remaining <= 0) {
        document.querySelector("h1").textContent = "静等期待";
      }
    }
    updateCountdown();
    setInterval(updateCountdown, 250);
  </script>
</body>
</html>
